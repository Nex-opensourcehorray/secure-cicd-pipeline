name: Deploy approved image to NonProd ECS

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character lowercase Git commit SHA already published to ECR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ecs-deployment-nonprod
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate trusted source and publication provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Guard trusted GitHub context and source format
        id: source
        shell: bash
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
          ACTUAL_OWNER_ID: ${{ github.repository_owner_id }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          [[ "$ACTUAL_REPOSITORY" == "Nex-opensourcehorray/secure-cicd-pipeline" ]]
          [[ "$ACTUAL_REPOSITORY_ID" == "1409968457" ]]
          [[ "$ACTUAL_OWNER_ID" == "82328818" ]]
          [[ "$ACTUAL_REF" == "refs/heads/main" ]]
          [[ "$ACTUAL_REF_TYPE" == "branch" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out trusted current main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate ancestry and trusted workflow evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"

          require_successful_run() {
            local workflow_file="$1"
            local expected_event="$2"
            local response
            local count

            response="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
              -f "head_sha=$SOURCE_SHA" \
              -f status=success \
              -f per_page=100)"
            count="$(jq --arg sha "$SOURCE_SHA" --arg event "$expected_event" '
              [
                .workflow_runs[]
                | select(
                    .head_sha == $sha and
                    .head_branch == "main" and
                    .status == "completed" and
                    .conclusion == "success" and
                    .event == $event
                  )
              ]
              | length
            ' <<<"$response")"
            [[ "$count" -ge 1 ]]
          }

          require_successful_run "ci.yml" "push"
          require_successful_run "security.yml" "push"
          require_successful_run "deploy.yml" "workflow_dispatch"

          {
            echo "## Deployment source provenance"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Trusted main ancestor: PASS"
            echo "- CI: PASS"
            echo "- Security: PASS"
            echo "- Trusted image publication: PASS"
            echo "- Candidate code executed: NO"
          } >> "$GITHUB_STEP_SUMMARY"

  validate-deployment-candidate:
    name: Deploy approved digest and validate runtime
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: nonprod
    permissions:
      contents: read
      id-token: write
    env:
      AWS_PAGER: ""
      SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_MANAGEMENT_ACCOUNT_ID: ${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}
      AWS_NONPROD_ACCOUNT_ID: ${{ vars.AWS_NONPROD_ACCOUNT_ID }}
      AWS_MANAGEMENT_DEPLOY_ROLE_ARN: ${{ vars.AWS_MANAGEMENT_DEPLOY_ROLE_ARN }}
      AWS_NONPROD_ECS_DEPLOY_ROLE_ARN: ${{ vars.AWS_NONPROD_ECS_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      ECS_TASK_FAMILY: secure-cicd-pipeline-nonprod
      ECS_TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-southeast-1:119033255630:targetgroup/secure-cicd-pipeline-nonprod-tg/919de08359876a7b
      ALB_SECURITY_GROUP_ID: sg-0a082963a48d1cc39

    steps:
      - name: Check out trusted workflow helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate fixed deployment metadata
        shell: bash
        run: |
          set -euo pipefail

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_REGION" == "ap-southeast-1" ]]
          [[ "$AWS_MANAGEMENT_ACCOUNT_ID" == "191125774822" ]]
          [[ "$AWS_NONPROD_ACCOUNT_ID" == "119033255630" ]]
          [[ "$AWS_MANAGEMENT_DEPLOY_ROLE_ARN" == "arn:aws:iam::191125774822:role/secure-cicd-pipeline-nonprod-github-ecs-deployer" ]]
          [[ "$AWS_NONPROD_ECS_DEPLOY_ROLE_ARN" == "arn:aws:iam::119033255630:role/secure-cicd-pipeline-nonprod-ecs-deployer" ]]
          [[ "$ECR_REPOSITORY" == "secure-cicd-demo" ]]
          [[ "$ECS_CLUSTER_NAME" == "secure-cicd-pipeline-nonprod" ]]
          [[ "$ECS_SERVICE_NAME" == "secure-cicd-pipeline-nonprod" ]]
          [[ "$ECS_CONTAINER_NAME" == "secure-cicd-demo" ]]
          [[ "$ECS_EXECUTION_ROLE_ARN" == "arn:aws:iam::119033255630:role/secure-cicd-pipeline-nonprod-ecs-execution" ]]
          [[ "$ECS_TASK_FAMILY" == "secure-cicd-pipeline-nonprod" ]]
          [[ "$ECS_TARGET_GROUP_ARN" == "arn:aws:elasticloadbalancing:ap-southeast-1:119033255630:targetgroup/secure-cicd-pipeline-nonprod-tg/919de08359876a7b" ]]
          [[ "$ALB_SECURITY_GROUP_ID" == "sg-0a082963a48d1cc39" ]]

      - name: Authenticate to the Management deployment broker
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_MANAGEMENT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}
          role-session-name: ecs-deploy-mgmt-${{ github.run_id }}

      - name: Verify Management deployment identity
        shell: bash
        run: |
          set -euo pipefail

          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$caller_account" == "$AWS_MANAGEMENT_ACCOUNT_ID" ]]
          case "$caller_arn" in
            arn:aws:sts::191125774822:assumed-role/secure-cicd-pipeline-nonprod-github-ecs-deployer/*) ;;
            *) exit 1 ;;
          esac

      - name: Chain into the NonProd deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_NONPROD_ECS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_NONPROD_ACCOUNT_ID }}
          role-chaining: true
          role-skip-session-tagging: true
          role-session-name: ecs-deploy-nonprod-${{ github.run_id }}

      - name: Validate candidate and prepare allowlisted task revision
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$caller_account" == "$AWS_NONPROD_ACCOUNT_ID" ]]
          case "$caller_arn" in
            arn:aws:sts::119033255630:assumed-role/secure-cicd-pipeline-nonprod-ecs-deployer/*) ;;
            *) exit 1 ;;
          esac

          work_dir="$RUNNER_TEMP/ecs-deployment-$GITHUB_RUN_ID"
          install -d -m 700 "$work_dir"

          run_aws_json() {
            local output="$1"
            shift
            local error_file="$work_dir/aws-error"
            local exception
            local message

            : > "$error_file"
            if ! "$@" > "$output" 2> "$error_file"; then
              exception="$(
                sed -nE 's/^.*An error occurred \(([^)]+)\).*$/\1/p' "$error_file" |
                  head -n 1
              )"
              message="$(
                sed -nE 's/^.*An error occurred \([^)]+\).*: (.*)$/\1/p' "$error_file" |
                  head -n 1
              )"
              if [[ -n "$exception" && -n "$message" ]]; then
                printf 'AWS read failed (%s): %.500s\n' "$exception" "$message" >&2
              else
                echo "AWS read failed with an unclassified AWS CLI error." >&2
              fi
              exit 1
            fi
          }

          candidate_json="$work_dir/candidate.json"
          candidate_scan_json="$work_dir/candidate-scan.json"
          candidate_scan_result="$work_dir/candidate-scan-result.json"
          service_json="$work_dir/service.json"
          task_definition_json="$work_dir/task-definition.json"
          registration_payload="$work_dir/register-task-definition.json"
          prepare_result="$work_dir/prepare-result.json"
          rollback_scan_json="$work_dir/rollback-scan.json"
          rollback_scan_result="$work_dir/rollback-scan-result.json"

          run_aws_json "$candidate_json" aws ecr describe-images \
            --region "$AWS_REGION" \
            --registry-id "$AWS_NONPROD_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$SOURCE_SHA" \
            --output json
          [[ "$(jq '.imageDetails | length' "$candidate_json")" == "1" ]]
          jq -e --arg source "$SOURCE_SHA" \
            '.imageDetails[0].imageTags | index($source) != null' \
            "$candidate_json" >/dev/null
          candidate_digest="$(jq -r '.imageDetails[0].imageDigest' "$candidate_json")"
          [[ "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate_uri="${AWS_NONPROD_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${candidate_digest}"

          run_aws_json "$candidate_scan_json" aws ecr describe-image-scan-findings \
            --region "$AWS_REGION" \
            --registry-id "$AWS_NONPROD_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$candidate_digest" \
            --output json
          python3 .github/scripts/validate_ecs_deployment_preflight.py scan \
            --input "$candidate_scan_json" \
            --label candidate > "$candidate_scan_result"

          run_aws_json "$service_json" aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --output json
          jq -e '(.failures | length) == 0 and (.services | length) == 1' \
            "$service_json" >/dev/null
          current_task_definition="$(jq -r '.services[0].taskDefinition' "$service_json")"
          task_prefix="arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:task-definition/secure-cicd-pipeline-nonprod:"
          [[ "$current_task_definition" == "$task_prefix"* ]]
          [[ "${current_task_definition#"$task_prefix"}" =~ ^[1-9][0-9]*$ ]]

          run_aws_json "$task_definition_json" aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$current_task_definition" \
            --output json
          python3 .github/scripts/validate_ecs_deployment_preflight.py prepare \
            --service "$service_json" \
            --task-definition "$task_definition_json" \
            --candidate-image "$candidate_uri" \
            --output-payload "$registration_payload" \
            --expected-cluster-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:cluster/${ECS_CLUSTER_NAME}" \
            --expected-service-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:service/${ECS_CLUSTER_NAME}/${ECS_SERVICE_NAME}" \
            --expected-service-name "$ECS_SERVICE_NAME" \
            --expected-task-family "$ECS_TASK_FAMILY" \
            --expected-container-name "$ECS_CONTAINER_NAME" \
            --expected-execution-role-arn "$ECS_EXECUTION_ROLE_ARN" \
            --expected-image-prefix "${AWS_NONPROD_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@" \
            --expected-region "$AWS_REGION" \
            --expected-target-group-arn "$ECS_TARGET_GROUP_ARN" \
            --expected-alb-security-group-id "$ALB_SECURITY_GROUP_ID" > "$prepare_result"

          rollback_digest="$(jq -r '.current_digest' "$prepare_result")"
          rollback_image="$(jq -r '.current_image' "$prepare_result")"
          [[ "$rollback_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$rollback_image" == "${AWS_NONPROD_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${rollback_digest}" ]]
          run_aws_json "$rollback_scan_json" aws ecr describe-image-scan-findings \
            --region "$AWS_REGION" \
            --registry-id "$AWS_NONPROD_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$rollback_digest" \
            --output json
          python3 .github/scripts/validate_ecs_deployment_preflight.py scan \
            --input "$rollback_scan_json" \
            --label rollback > "$rollback_scan_result"

          candidate_high="$(jq -r '.high' "$candidate_scan_result")"
          candidate_critical="$(jq -r '.critical' "$candidate_scan_result")"
          rollback_high="$(jq -r '.high' "$rollback_scan_result")"
          rollback_critical="$(jq -r '.critical' "$rollback_scan_result")"
          current_task_definition="$(jq -r '.task_definition_arn' "$prepare_result")"
          current_revision="$(jq -r '.task_definition_revision' "$prepare_result")"

          {
            echo "candidate_digest=$candidate_digest"
            echo "candidate_high=$candidate_high"
            echo "candidate_critical=$candidate_critical"
            echo "candidate_uri=$candidate_uri"
            echo "current_task_definition=$current_task_definition"
            echo "current_revision=$current_revision"
            echo "rollback_digest=$rollback_digest"
            echo "rollback_high=$rollback_high"
            echo "rollback_critical=$rollback_critical"
            echo "rollback_image=$rollback_image"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Deployment candidate preflight"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Trusted main ancestor: PASS"
            echo "- CI: PASS"
            echo "- Security: PASS"
            echo "- Trusted image publication: PASS"
            echo "- Candidate ECR digest: \`$candidate_digest\`"
            echo "- Candidate runtime URI is digest-addressed: PASS"
            echo "- Candidate HIGH: $candidate_high"
            echo "- Candidate CRITICAL: $candidate_critical"
            echo "- Current rollback digest: \`$rollback_digest\`"
            echo "- Rollback HIGH: $rollback_high"
            echo "- Rollback CRITICAL: $rollback_critical"
            echo "- Service: STABLE"
            echo "- Task definition invariants: PASS"
            echo "- Allowlisted registration payload: PASS"
            echo "- Only semantic change: containerDefinitions[0].image"
            echo "- Candidate image selected: \`${candidate_uri%%@*}@${candidate_digest}\`"
            echo "- Previous task definition preserved: \`$current_task_definition\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Register the approved digest-pinned task revision
        id: register
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/ecs-deployment-$GITHUB_RUN_ID"
          registration_payload="$work_dir/register-task-definition.json"
          registration_response="$work_dir/register-task-definition-response.json"
          registration_result="$work_dir/register-task-definition-result.json"
          error_file="$work_dir/aws-error"

          if ! aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json "file://$registration_payload" \
            --output json > "$registration_response" 2> "$error_file"; then
            echo "RegisterTaskDefinition failed; see the sanitized AWS error below." >&2
            sed -n '1,10p' "$error_file" >&2
            exit 1
          fi

          python3 .github/scripts/validate_ecs_deployment_preflight.py registration \
            --input "$registration_response" \
            --previous-task-definition-arn "${{ steps.prepare.outputs.current_task_definition }}" \
            --previous-revision "${{ steps.prepare.outputs.current_revision }}" \
            --candidate-image "${{ steps.prepare.outputs.candidate_uri }}" \
            --expected-cluster-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:cluster/${ECS_CLUSTER_NAME}" \
            --expected-service-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:service/${ECS_CLUSTER_NAME}/${ECS_SERVICE_NAME}" \
            --expected-service-name "$ECS_SERVICE_NAME" \
            --expected-task-family "$ECS_TASK_FAMILY" \
            --expected-container-name "$ECS_CONTAINER_NAME" \
            --expected-execution-role-arn "$ECS_EXECUTION_ROLE_ARN" \
            --expected-image-prefix "${AWS_NONPROD_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@" \
            --expected-region "$AWS_REGION" \
            --expected-target-group-arn "$ECS_TARGET_GROUP_ARN" \
            --expected-alb-security-group-id "$ALB_SECURITY_GROUP_ID" > "$registration_result"

          new_task_definition="$(jq -r '.new_task_definition_arn' "$registration_result")"
          new_revision="$(jq -r '.new_task_definition_revision' "$registration_result")"
          {
            echo "new_task_definition=$new_task_definition"
            echo "new_revision=$new_revision"
          } >> "$GITHUB_OUTPUT"

      - name: Update only the exact service task-definition pointer
        id: update
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/ecs-deployment-$GITHUB_RUN_ID"
          update_request="$work_dir/update-service.json"
          update_response="$work_dir/update-service-response.json"
          update_result="$work_dir/update-service-result.json"
          error_file="$work_dir/aws-error"

          python3 .github/scripts/validate_ecs_deployment_preflight.py update-request \
            --task-definition-arn "${{ steps.register.outputs.new_task_definition }}" \
            --output-request "$update_request" \
            --expected-cluster-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:cluster/${ECS_CLUSTER_NAME}" \
            --expected-service-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:service/${ECS_CLUSTER_NAME}/${ECS_SERVICE_NAME}" \
            --expected-service-name "$ECS_SERVICE_NAME" \
            --expected-task-family "$ECS_TASK_FAMILY" \
            --expected-container-name "$ECS_CONTAINER_NAME" \
            --expected-execution-role-arn "$ECS_EXECUTION_ROLE_ARN" \
            --expected-image-prefix "${AWS_NONPROD_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@" \
            --expected-region "$AWS_REGION" \
            --expected-target-group-arn "$ECS_TARGET_GROUP_ARN" \
            --expected-alb-security-group-id "$ALB_SECURITY_GROUP_ID" > "$work_dir/update-request-result.json"

          if ! aws ecs update-service \
            --region "$AWS_REGION" \
            --cli-input-json "file://$update_request" \
            --output json > "$update_response" 2> "$error_file"; then
            echo "UpdateService failed; see the sanitized AWS error below." >&2
            sed -n '1,10p' "$error_file" >&2
            exit 1
          fi

          python3 .github/scripts/validate_ecs_deployment_preflight.py update-response \
            --input "$update_response" \
            --task-definition-arn "${{ steps.register.outputs.new_task_definition }}" \
            --expected-cluster-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:cluster/${ECS_CLUSTER_NAME}" \
            --expected-service-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:service/${ECS_CLUSTER_NAME}/${ECS_SERVICE_NAME}" \
            --expected-service-name "$ECS_SERVICE_NAME" \
            --expected-task-family "$ECS_TASK_FAMILY" \
            --expected-container-name "$ECS_CONTAINER_NAME" \
            --expected-execution-role-arn "$ECS_EXECUTION_ROLE_ARN" \
            --expected-image-prefix "${AWS_NONPROD_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@" \
            --expected-region "$AWS_REGION" \
            --expected-target-group-arn "$ECS_TARGET_GROUP_ARN" \
            --expected-alb-security-group-id "$ALB_SECURITY_GROUP_ID" > "$update_result"

      - name: Observe and classify the deployment outcome
        id: outcome
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/ecs-deployment-$GITHUB_RUN_ID"
          waiter_error="$work_dir/services-stable-error"

          set +e
          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            2> "$waiter_error"
          waiter_exit_code=$?
          set -e

          run_aws_json() {
            local output="$1"
            shift
            local error_file="$work_dir/aws-observation-error"
            local exception
            local message

            : > "$error_file"
            if ! "$@" > "$output" 2> "$error_file"; then
              exception="$(sed -nE 's/^.*An error occurred \(([^)]+)\).*$/\1/p' "$error_file" | head -n 1)"
              message="$(sed -nE 's/^.*An error occurred \([^)]+\).*: (.*)$/\1/p' "$error_file" | head -n 1)"
              if [[ -n "$exception" && -n "$message" ]]; then
                printf 'AWS observation failed (%s): %.500s\n' "$exception" "$message" >&2
              else
                echo "AWS observation failed with an unclassified AWS CLI error." >&2
              fi
              exit 1
            fi
          }

          outcome="IN_PROGRESS_OR_AMBIGUOUS"
          outcome_result="$work_dir/deployment-outcome.json"
          for attempt in 1 2 3 4 5 6; do
            service_json="$work_dir/observed-service.json"
            task_definition_json="$work_dir/observed-task-definition.json"
            task_list_json="$work_dir/observed-task-list.json"
            tasks_json="$work_dir/observed-tasks.json"
            target_health_json="$work_dir/observed-target-health.json"
            security_group_json="$work_dir/observed-alb-security-group.json"

            run_aws_json "$service_json" aws ecs describe-services \
              --region "$AWS_REGION" \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "$ECS_SERVICE_NAME" \
              --output json

            observed_task_definition="$(jq -r '.services[0].taskDefinition // empty' "$service_json")"
            task_prefix="arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:task-definition/${ECS_TASK_FAMILY}:"
            if [[ "$observed_task_definition" == "$task_prefix"* ]] && \
              [[ "${observed_task_definition#"$task_prefix"}" =~ ^[1-9][0-9]*$ ]]; then
              run_aws_json "$task_definition_json" aws ecs describe-task-definition \
                --region "$AWS_REGION" \
                --task-definition "$observed_task_definition" \
                --output json
            else
              printf '%s\n' '{}' > "$task_definition_json"
            fi

            run_aws_json "$task_list_json" aws ecs list-tasks \
              --region "$AWS_REGION" \
              --cluster "$ECS_CLUSTER_NAME" \
              --service-name "$ECS_SERVICE_NAME" \
              --desired-status RUNNING \
              --output json
            mapfile -t task_arns < <(jq -r '.taskArns[]' "$task_list_json")
            if (( ${#task_arns[@]} > 0 )); then
              run_aws_json "$tasks_json" aws ecs describe-tasks \
                --region "$AWS_REGION" \
                --cluster "$ECS_CLUSTER_NAME" \
                --tasks "${task_arns[@]}" \
                --output json
            else
              printf '%s\n' '{"failures":[],"tasks":[]}' > "$tasks_json"
            fi

            run_aws_json "$target_health_json" aws elbv2 describe-target-health \
              --region "$AWS_REGION" \
              --target-group-arn "$ECS_TARGET_GROUP_ARN" \
              --output json
            run_aws_json "$security_group_json" aws ec2 describe-security-groups \
              --region "$AWS_REGION" \
              --group-ids "$ALB_SECURITY_GROUP_ID" \
              --output json

            python3 .github/scripts/validate_ecs_deployment_preflight.py deployment-outcome \
              --service "$service_json" \
              --task-definition "$task_definition_json" \
              --tasks "$tasks_json" \
              --target-health "$target_health_json" \
              --security-group "$security_group_json" \
              --previous-task-definition-arn "${{ steps.prepare.outputs.current_task_definition }}" \
              --previous-revision "${{ steps.prepare.outputs.current_revision }}" \
              --previous-image "${{ steps.prepare.outputs.rollback_image }}" \
              --candidate-task-definition-arn "${{ steps.register.outputs.new_task_definition }}" \
              --candidate-revision "${{ steps.register.outputs.new_revision }}" \
              --candidate-image "${{ steps.prepare.outputs.candidate_uri }}" \
              --waiter-exit-code "$waiter_exit_code" \
              --expected-cluster-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:cluster/${ECS_CLUSTER_NAME}" \
              --expected-service-arn "arn:aws:ecs:${AWS_REGION}:${AWS_NONPROD_ACCOUNT_ID}:service/${ECS_CLUSTER_NAME}/${ECS_SERVICE_NAME}" \
              --expected-service-name "$ECS_SERVICE_NAME" \
              --expected-task-family "$ECS_TASK_FAMILY" \
              --expected-container-name "$ECS_CONTAINER_NAME" \
              --expected-execution-role-arn "$ECS_EXECUTION_ROLE_ARN" \
              --expected-image-prefix "${AWS_NONPROD_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@" \
              --expected-region "$AWS_REGION" \
              --expected-target-group-arn "$ECS_TARGET_GROUP_ARN" \
              --expected-alb-security-group-id "$ALB_SECURITY_GROUP_ID" > "$outcome_result"

            outcome="$(jq -r '.outcome' "$outcome_result")"
            if [[ "$outcome" != "IN_PROGRESS_OR_AMBIGUOUS" ]] || [[ "$attempt" == "6" ]]; then
              break
            fi
            sleep 20
          done

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

          if [[ "$outcome" == "SUCCESS" ]]; then
            {
              echo "## ECS deployment result"
              echo
              echo "- Source SHA: \`$SOURCE_SHA\`"
              echo "- Candidate digest: \`${{ steps.prepare.outputs.candidate_digest }}\`"
              echo "- Previous task definition: \`${{ steps.prepare.outputs.current_task_definition }}\`"
              echo "- Previous rollback digest: \`${{ steps.prepare.outputs.rollback_digest }}\`"
              echo "- New task definition: \`${{ steps.register.outputs.new_task_definition }}\`"
              echo "- New revision: \`${{ steps.register.outputs.new_revision }}\`"
              echo "- Deployment result: SUCCESS"
              echo "- Service stability: PASS"
              echo "- Running digest verification: PASS"
              echo "- Target health: healthy"
              echo "- Public task IP: absent"
              echo "- ALB inbound rules: 0"
              echo "- Previous task definition deregistered: NO"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$outcome" == "AUTOMATIC_ROLLBACK_CONFIRMED" ]]; then
            {
              echo "## ECS deployment rollback result"
              echo
              echo "- Source SHA: \`$SOURCE_SHA\`"
              echo "- Candidate digest: \`${{ steps.prepare.outputs.candidate_digest }}\`"
              echo "- Previous task definition: \`${{ steps.prepare.outputs.current_task_definition }}\`"
              echo "- Attempted task definition: \`${{ steps.register.outputs.new_task_definition }}\`"
              echo "- Deployment result: FAILED"
              echo "- ECS circuit breaker: ROLLBACK OBSERVED"
              echo "- Automatic rollback: CONFIRMED"
              echo "- Restored task definition: PASS"
              echo "- Restored digest: PASS"
              echo "- Service stability after rollback: PASS"
              echo "- Runtime security after rollback: PASS"
              echo "- Target health after rollback: PASS"
              echo "- Public task IP: absent"
              echo "- ALB inbound rules: 0"
              echo "- Manual rollback issued: NO"
              echo "- Task definition deregistered: NO"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## ECS deployment rollback result"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Candidate digest: \`${{ steps.prepare.outputs.candidate_digest }}\`"
            echo "- Attempted task definition: \`${{ steps.register.outputs.new_task_definition }}\`"
            echo "- Deployment result: FAILED"
            echo "- Outcome classification: \`$outcome\`"
            echo "- Automatic rollback: ROLLBACK NOT VERIFIED"
            echo "- Manual rollback issued: NO"
            echo "- Task definition deregistered: NO"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Build sanitized deployment evidence
        id: evidence
        if: always()
        shell: bash
        env:
          PREPARE_RESULT: ${{ steps.prepare.outcome }}
          REGISTER_RESULT: ${{ steps.register.outcome }}
          UPDATE_RESULT: ${{ steps.update.outcome }}
          OBSERVATION_RESULT: ${{ steps.outcome.outcome }}
          OBSERVED_OUTCOME: ${{ steps.outcome.outputs.outcome }}
          CANDIDATE_DIGEST: ${{ steps.prepare.outputs.candidate_digest }}
          CANDIDATE_HIGH: ${{ steps.prepare.outputs.candidate_high }}
          CANDIDATE_CRITICAL: ${{ steps.prepare.outputs.candidate_critical }}
          ROLLBACK_REVISION: ${{ steps.prepare.outputs.current_revision }}
          ROLLBACK_DIGEST: ${{ steps.prepare.outputs.rollback_digest }}
          ROLLBACK_HIGH: ${{ steps.prepare.outputs.rollback_high }}
          ROLLBACK_CRITICAL: ${{ steps.prepare.outputs.rollback_critical }}
          ATTEMPTED_REVISION: ${{ steps.register.outputs.new_revision }}
        run: |
          set -euo pipefail
          umask 077

          evidence_dir="$RUNNER_TEMP/deployment-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_name="nonprod-deployment-evidence-${GITHUB_RUN_ID}"
          outcome="FAIL_CLOSED_UNVERIFIED"

          if [[ "$PREPARE_RESULT" != "success" ]]; then
            outcome="PRE_MUTATION_FAILURE"
          elif [[ "$REGISTER_RESULT" != "success" ]] || \
            [[ "$UPDATE_RESULT" != "success" ]]; then
            outcome="FAIL_CLOSED_UNVERIFIED"
          elif [[ "$OBSERVATION_RESULT" == "success" ]] && \
            [[ "$OBSERVED_OUTCOME" == "SUCCESS" ]]; then
            outcome="SUCCESS"
          elif [[ "$OBSERVED_OUTCOME" == "AUTOMATIC_ROLLBACK_CONFIRMED" ]]; then
            outcome="AUTOMATIC_ROLLBACK_CONFIRMED"
          fi

          args=(
            build
            --output-dir "$evidence_dir"
            --repository "$GITHUB_REPOSITORY"
            --environment "nonprod"
            --task-definition-family "$ECS_TASK_FAMILY"
            --workflow-name "Deploy approved image to NonProd ECS"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --source-workflow-sha "$GITHUB_SHA"
            --candidate-source-sha "$SOURCE_SHA"
            --outcome "$outcome"
          )

          if [[ "$PREPARE_RESULT" == "success" ]]; then
            [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_HIGH" =~ ^[0-9]+$ ]]
            [[ "$CANDIDATE_CRITICAL" =~ ^[0-9]+$ ]]
            [[ "$ROLLBACK_REVISION" =~ ^[1-9][0-9]*$ ]]
            [[ "$ROLLBACK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$ROLLBACK_HIGH" =~ ^[0-9]+$ ]]
            [[ "$ROLLBACK_CRITICAL" =~ ^[0-9]+$ ]]
            args+=(
              --candidate-digest "$CANDIDATE_DIGEST"
              --candidate-high "$CANDIDATE_HIGH"
              --candidate-critical "$CANDIDATE_CRITICAL"
              --rollback-revision "$ROLLBACK_REVISION"
              --rollback-digest "$ROLLBACK_DIGEST"
              --rollback-high "$ROLLBACK_HIGH"
              --rollback-critical "$ROLLBACK_CRITICAL"
            )
          fi

          if [[ "$REGISTER_RESULT" == "success" ]]; then
            [[ "$ATTEMPTED_REVISION" =~ ^[1-9][0-9]*$ ]]
            args+=(--attempted-revision "$ATTEMPTED_REVISION")
          fi

          if [[ "$outcome" == "SUCCESS" ]] || \
            [[ "$outcome" == "AUTOMATIC_ROLLBACK_CONFIRMED" ]]; then
            args+=(
              --service-stable true
              --target-healthy true
              --public-task-ip-absent true
              --alb-ingress-rules 0
            )
          fi
          if [[ "$outcome" == "AUTOMATIC_ROLLBACK_CONFIRMED" ]]; then
            args+=(--restored-revision "$ROLLBACK_REVISION")
          fi

          manifest_sha256="$(
            python3 .github/scripts/build_deployment_evidence.py "${args[@]}"
          )"
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          verified_sha256="$(
            python3 .github/scripts/build_deployment_evidence.py verify \
              --manifest "$evidence_dir/deployment-evidence.json" \
              --checksum "$evidence_dir/deployment-evidence.sha256"
          )"
          [[ "$verified_sha256" == "$manifest_sha256" ]]

          mapfile -t evidence_files < <(
            find "$evidence_dir" -maxdepth 1 -type f -printf '%f\n' | sort
          )
          [[ "${#evidence_files[@]}" == "2" ]]
          [[ "${evidence_files[0]}" == "deployment-evidence.json" ]]
          [[ "${evidence_files[1]}" == "deployment-evidence.sha256" ]]

          {
            echo "artifact_name=$artifact_name"
            echo "evidence_dir=$evidence_dir"
            echo "manifest_sha256=$manifest_sha256"
            echo "schema_version=1"
          } >> "$GITHUB_OUTPUT"

      - name: Upload sanitized deployment evidence
        id: upload_evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: |
            ${{ steps.evidence.outputs.evidence_dir }}/deployment-evidence.json
            ${{ steps.evidence.outputs.evidence_dir }}/deployment-evidence.sha256
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

      - name: Record deployment evidence summary
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_evidence.outputs.artifact-digest }}
          ARTIFACT_NAME: ${{ steps.evidence.outputs.artifact_name }}
          MANIFEST_SHA256: ${{ steps.evidence.outputs.manifest_sha256 }}
          UPLOAD_RESULT: ${{ steps.upload_evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]

          {
            echo "## Evidence"
            echo
            echo "- Evidence schema: v1"
            echo "- Evidence artifact: \`$ARTIFACT_NAME\`"
            echo "- Manifest SHA-256: \`$MANIFEST_SHA256\`"
            echo "- Retention: 90 days"
            if [[ "$UPLOAD_RESULT" == "success" && -n "$ARTIFACT_DIGEST" ]]; then
              echo "- GitHub artifact digest: \`$ARTIFACT_DIGEST\`"
            else
              echo "- GitHub artifact upload: FAILED"
            fi
            echo "- Durable repository record: manual reviewed PR only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral deployment files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/ecs-deployment-$GITHUB_RUN_ID"
          evidence_dir="$RUNNER_TEMP/deployment-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$work_dir" ]]; then
            rm -rf -- "$work_dir"
          fi
          if [[ -d "$evidence_dir" ]]; then
            rm -rf -- "$evidence_dir"
          fi
