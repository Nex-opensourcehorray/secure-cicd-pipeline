name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit==1.9.4

      - name: Scan application source
        run: >-
          bandit --recursive application/app
          --severity-level medium
          --confidence-level medium

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            application/requirements.txt
            application/requirements-dev.txt

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit production dependencies
        run: >-
          pip-audit --strict --progress-spinner off
          --requirement application/requirements.txt

      - name: Audit development dependencies
        run: >-
          pip-audit --strict --progress-spinner off
          --requirement application/requirements-dev.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  iac-scan:
    name: Infrastructure-as-code scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect Terraform files
        id: terraform
        shell: bash
        run: |
          terraform_file="$(find terraform -type f -name '*.tf' -print -quit)"
          if [ -n "$terraform_file" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Terraform files detected; Checkov will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED - no Terraform files yet"
          fi

      - name: Set up Python for Checkov
        if: steps.terraform.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Checkov
        if: steps.terraform.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check checkov==3.3.19

      - name: Scan Terraform with Checkov
        if: steps.terraform.outputs.present == 'true'
        run: checkov --directory terraform --framework terraform

  container-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build local security image
        run: docker build --tag secure-cicd-demo:security ./application

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-cicd-demo:security
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: HIGH,CRITICAL
