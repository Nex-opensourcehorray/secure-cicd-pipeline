name: Publish trusted ECR image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecr-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: application

    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: application/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  publish:
    name: Scan and publish immutable image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_MANAGEMENT_ACCOUNT_ID: ${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}
      AWS_NONPROD_ACCOUNT_ID: ${{ vars.AWS_NONPROD_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      LOCAL_IMAGE: secure-cicd-demo:${{ github.sha }}

    steps:
      - name: Enforce trusted publication context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Nex-opensourcehorray/secure-cicd-pipeline"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$AWS_REGION"
          test -n "$AWS_MANAGEMENT_ACCOUNT_ID"
          test -n "$AWS_NONPROD_ACCOUNT_ID"
          test -n "$ECR_REPOSITORY"
          test -n "${{ vars.AWS_MANAGEMENT_BROKER_ROLE_ARN }}"
          test -n "${{ vars.AWS_NONPROD_ECR_PUBLISH_ROLE_ARN }}"

      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build commit-addressed image
        run: docker build --tag "$LOCAL_IMAGE" ./application

      - name: Report complete vulnerability inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln,secret
          format: table
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Enforce HIGH and CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Configure Management broker credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_MANAGEMENT_BROKER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_MANAGEMENT_ACCOUNT_ID }}
          role-session-name: github-broker-${{ github.run_id }}

      - name: Configure NonProd publisher credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_NONPROD_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_NONPROD_ACCOUNT_ID }}
          role-chaining: true
          role-skip-session-tagging: true
          role-session-name: github-ecr-${{ github.run_id }}

      - name: Verify NonProd AWS account
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account" != "$AWS_NONPROD_ACCOUNT_ID" ]; then
            echo "Expected NonProd account $AWS_NONPROD_ACCOUNT_ID, received $actual_account" >&2
            exit 1
          fi

      - name: Log in to private Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registries: ${{ env.AWS_NONPROD_ACCOUNT_ID }}
          mask-password: "true"

      - name: Push immutable commit image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          ECR_REGISTRY="${AWS_NONPROD_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$image_uri"
          docker push "$image_uri"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Verify and report immutable digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --registry-id "$AWS_NONPROD_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          case "$digest" in
            sha256:*) ;;
            *) echo "Expected an ECR sha256 digest, received: $digest" >&2; exit 1 ;;
          esac

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Trusted ECR image"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Image: \`${{ steps.push.outputs.image_uri }}\`"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
